<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">Grouped validation model progression</title>
  <desc id="desc">Accuracy and macro F1 increase across six leakage-free traffic-sign model iterations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accuracy" x1="0" x2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="f1" x1="0" x2="1">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="1" stop-color="#56d364"/>
    </linearGradient>
  </defs>
  <rect width="980" height="540" rx="18" fill="url(#bg)"/>
  <text x="48" y="55" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Honest grouped-validation progression</text>
  <text x="48" y="84" fill="#8b949e" font-family="Arial, sans-serif" font-size="15">Performance on unseen physical-sign groups</text>
  <circle cx="715" cy="51" r="7" fill="#58a6ff"/><text x="730" y="57" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="14">Accuracy</text>
  <circle cx="823" cy="51" r="7" fill="#56d364"/><text x="838" y="57" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="14">Macro F1</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <text x="48" y="131" fill="#c9d1d9">Initial grouped</text>
    <rect x="225" y="112" width="493" height="13" rx="6" fill="url(#accuracy)"/><text x="728" y="124" fill="#58a6ff">70.45%</text>
    <rect x="225" y="132" width="452" height="13" rx="6" fill="url(#f1)"/><text x="687" y="144" fill="#56d364">64.63%</text>

    <text x="48" y="201" fill="#c9d1d9">Fine-tuned checkpoint</text>
    <rect x="225" y="182" width="615" height="13" rx="6" fill="url(#accuracy)"/><text x="850" y="194" fill="#58a6ff">87.92%</text>
    <rect x="225" y="202" width="574" height="13" rx="6" fill="url(#f1)"/><text x="809" y="214" fill="#56d364">82.04%</text>

    <text x="48" y="271" fill="#c9d1d9">Earlier six-view TTA</text>
    <rect x="225" y="252" width="621" height="13" rx="6" fill="url(#accuracy)"/><text x="856" y="264" fill="#58a6ff">88.65%</text>
    <rect x="225" y="272" width="583" height="13" rx="6" fill="url(#f1)"/><text x="818" y="284" fill="#56d364">83.22%</text>

    <text x="48" y="341" fill="#c9d1d9">Guarded macro-F1</text>
    <rect x="225" y="322" width="637" height="13" rx="6" fill="url(#accuracy)"/><text x="872" y="334" fill="#58a6ff">91.03%</text>
    <rect x="225" y="342" width="625" height="13" rx="6" fill="url(#f1)"/><text x="860" y="354" fill="#56d364">89.26%</text>

    <text x="48" y="411" fill="#c9d1d9">Guarded six-view TTA</text>
    <rect x="225" y="392" width="645" height="13" rx="6" fill="url(#accuracy)"/><text x="880" y="404" fill="#58a6ff">92.12%</text>
    <rect x="225" y="412" width="633" height="13" rx="6" fill="url(#f1)"/><text x="868" y="424" fill="#56d364">90.39%</text>

    <text x="48" y="481" fill="#f0f6fc" font-weight="700">Exposure-trained honest</text>
    <rect x="225" y="462" width="650" height="13" rx="6" fill="url(#accuracy)"/><text x="885" y="474" fill="#58a6ff" font-weight="700">92.90%</text>
    <rect x="225" y="482" width="639" height="13" rx="6" fill="url(#f1)"/><text x="874" y="494" fill="#56d364" font-weight="700">91.29%</text>
  </g>
  <line x1="225" y1="508" x2="914" y2="508" stroke="#30363d"/>
  <text x="225" y="528" fill="#8b949e" font-family="Arial, sans-serif" font-size="12">0%</text>
  <text x="890" y="528" fill="#8b949e" font-family="Arial, sans-serif" font-size="12">100%</text>
</svg>
